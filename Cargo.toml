[workspace]
members = ["spur-ast", "spur-core", "spur-liquid", "spur-cli", "spur-lsp", "xtask", "spur-bench"]
resolver = "3"
exclude = ["vendor"]
# spur-bench defaults to the formulog feature, whose build script needs the
# Formulog toolchain. Keep it out of the default set so the plain workspace
# build unifies only the features the spur binary itself asks for.
default-members = ["spur-ast", "spur-core", "spur-liquid", "spur-cli", "spur-lsp", "xtask"]

[profile.release]
debug = 1

[patch.crates-io]
parquet = { path = "vendor/parquet" }
