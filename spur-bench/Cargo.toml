[package]
name = "spur-bench"
version = "0.1.0"
edition = "2024"

[features]
default = ["native-checker", "formulog"]
native-checker = ["spur-core/native-checker", "spur-liquid/native-checker"]
formulog = ["spur-core/formulog", "spur-liquid/formulog", "spur-liquid/bench-support"]

[dependencies]
spur-core = { path = "../spur-core", default-features = false }
spur-liquid = { path = "../spur-liquid", default-features = false }
spur-ast = { path = "../spur-ast" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "checker_comparison"
harness = false
